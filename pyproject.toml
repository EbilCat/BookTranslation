[project]
name = "booktranslation"
version = "0.1.0"
description = "Translate public-domain Project Gutenberg books into Southeast Asian languages using the SEA-LION API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.49.0",
    "python-dotenv>=1.2.4",
]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions are self-documenting via descriptive names; don't require
# docstrings (D) on the test suite.
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "main.py"]
# src/ has no __init__.py (flat package imported as ``src.*``); these let mypy
# resolve the layout the same way the runtime pythonpath ("." ) does.
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]
